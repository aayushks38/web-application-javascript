<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 10 - Prime Number Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .input-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
            width: 100%;
        }
        .btn:hover {
            background: #764ba2;
        }
        .result {
            margin-top: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        .result-number {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        .result-status {
            font-size: 2em;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        .prime {
            background: #d4edda;
            color: #155724;
        }
        .not-prime {
            background: #f8d7da;
            color: #721c24;
        }
        .explanation {
            font-size: 1em;
            color: #666;
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            text-align: left;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Assignment 10</h1>
        <p class="subtitle">Prime Number Checker</p>
        
        <div class="input-group">
            <label for="number">Enter a Number:</label>
            <input type="number" id="number" placeholder="Enter a positive integer" min="1">
        </div>
        
        <button class="btn" onclick="checkPrime()">Check Prime</button>
        
        <div class="result" id="result"></div>
        
        <a href="index.html" class="back-btn">← Back to Index</a>
    </div>

    <script>
        // Function to check if a number is prime using loops and conditionals
        function isPrime(number) {
            // Numbers less than 2 are not prime
            if (number < 2) {
                return false;
            }
            
            // 2 is prime
            if (number === 2) {
                return true;
            }
            
            // Even numbers greater than 2 are not prime
            if (number % 2 === 0) {
                return false;
            }
            
            // Check odd divisors up to square root of number
            for (let i = 3; i <= Math.sqrt(number); i += 2) {
                if (number % i === 0) {
                    return false;
                }
            }
            
            return true;
        }

        // Function to get explanation
        function getExplanation(number, prime) {
            if (number < 2) {
                return `Numbers less than 2 are not considered prime numbers.`;
            }
            
            if (number === 2) {
                return `2 is the only even prime number.`;
            }
            
            if (prime) {
                return `${number} is a prime number because it has no divisors other than 1 and itself.`;
            } else {
                // Find first divisor
                for (let i = 2; i <= Math.sqrt(number); i++) {
                    if (number % i === 0) {
                        return `${number} is not a prime number because it is divisible by ${i} (${number} ÷ ${i} = ${number/i}).`;
                    }
                }
            }
        }

        // Main function to check and display result
        function checkPrime() {
            const number = parseInt(document.getElementById('number').value);
            
            if (isNaN(number) || number < 1) {
                alert('Please enter a valid positive integer!');
                return;
            }

            const prime = isPrime(number);
            const explanation = getExplanation(number, prime);
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            
            if (prime) {
                resultDiv.innerHTML = `
                    <div class="result-number">${number}</div>
                    <div class="result-status prime">PRIME NUMBER</div>
                    <div class="explanation">${explanation}</div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <div class="result-number">${number}</div>
                    <div class="result-status not-prime">NOT A PRIME NUMBER</div>
                    <div class="explanation">${explanation}</div>
                `;
            }
        }

        // Allow Enter key to trigger check
        document.getElementById('number').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                checkPrime();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 13 - Calculator with Switch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .input-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
            width: 100%;
        }
        .btn:hover {
            background: #764ba2;
        }
        .result {
            margin-top: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        .operation-display {
            font-size: 1.5em;
            color: #333;
            margin: 20px 0;
        }
        .result-value {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Question 13</h1>
        <p class="subtitle">Simple Calculator using Switch Statement</p>
        
        <div class="input-group">
            <label for="num1">First Number:</label>
            <input type="number" id="num1" placeholder="Enter first number" step="any">
        </div>
        
        <div class="input-group">
            <label for="operator">Operator:</label>
            <select id="operator">
                <option value="+">+ (Addition)</option>
                <option value="-">- (Subtraction)</option>
                <option value="*">× (Multiplication)</option>
                <option value="/">÷ (Division)</option>
                <option value="%">% (Modulus)</option>
            </select>
        </div>
        
        <div class="input-group">
            <label for="num2">Second Number:</label>
            <input type="number" id="num2" placeholder="Enter second number" step="any">
        </div>
        
        <button class="btn" onclick="calculate()">Calculate</button>
        
        <div class="result" id="result"></div>
        
        <a href="index.html" class="back-btn">← Back to Index</a>
    </div>

    <script>
        // Calculator function using switch statement
        function calculator(num1, num2, operator) {
            let result;
            
            switch (operator) {
                case '+':
                    result = num1 + num2;
                    break;
                case '-':
                    result = num1 - num2;
                    break;
                case '*':
                    result = num1 * num2;
                    break;
                case '/':
                    if (num2 === 0) {
                        return "Error: Cannot divide by zero";
                    }
                    result = num1 / num2;
                    break;
                case '%':
                    if (num2 === 0) {
                        return "Error: Cannot perform modulus with zero";
                    }
                    result = num1 % num2;
                    break;
                default:
                    return "Error: Invalid operator";
            }
            
            return result;
        }

        // Function to get operator symbol
        function getOperatorSymbol(operator) {
            switch (operator) {
                case '+': return '+';
                case '-': return '-';
                case '*': return '×';
                case '/': return '÷';
                case '%': return '%';
                default: return operator;
            }
        }

        // Main calculation function
        function calculate() {
            const num1 = parseFloat(document.getElementById('num1').value);
            const num2 = parseFloat(document.getElementById('num2').value);
            const operator = document.getElementById('operator').value;
            
            if (isNaN(num1) || isNaN(num2)) {
                alert('Please enter valid numbers!');
                return;
            }

            const result = calculator(num1, num2, operator);
            const operatorSymbol = getOperatorSymbol(operator);
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            
            if (typeof result === 'string' && result.startsWith('Error')) {
                resultDiv.innerHTML = `
                    <div class="operation-display">${num1} ${operatorSymbol} ${num2}</div>
                    <div class="result-value" style="color: #dc3545;">${result}</div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <div class="operation-display">${num1} ${operatorSymbol} ${num2}</div>
                    <div class="result-value">${result}</div>
                `;
            }
        }

        // Allow Enter key to trigger calculation
        document.getElementById('num2').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                calculate();
            }
        });
    </script>
</body>
</html>

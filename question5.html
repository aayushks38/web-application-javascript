<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 5 - Even or Odd Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .input-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
            width: 100%;
        }
        .btn:hover {
            background: #764ba2;
        }
        .result {
            margin-top: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        .result-text {
            font-size: 1.5em;
            color: #333;
            margin: 10px 0;
        }
        .result-number {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        .result-status {
            font-size: 2em;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .even {
            background: #d4edda;
            color: #155724;
        }
        .odd {
            background: #f8d7da;
            color: #721c24;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Question 5</h1>
        <p class="subtitle">Even or Odd Number Checker</p>
        
        <div class="input-group">
            <label for="number">Enter a Number:</label>
            <input type="number" id="number" placeholder="Enter any integer">
        </div>
        
        <button class="btn" onclick="checkEvenOdd()">Check Even or Odd</button>
        
        <div class="result" id="result"></div>
        
        <a href="index.html" class="back-btn">← Back to Index</a>
    </div>

    <script>
        // Function to check if number is even or odd
        function isEven(number) {
            if (number % 2 === 0) {
                return true;
            } else {
                return false;
            }
        }

        // Main function to check and display result
        function checkEvenOdd() {
            const number = parseInt(document.getElementById('number').value);
            
            if (isNaN(number)) {
                alert('Please enter a valid number!');
                return;
            }

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            
            if (isEven(number)) {
                resultDiv.innerHTML = `
                    <div class="result-text">The number</div>
                    <div class="result-number">${number}</div>
                    <div class="result-status even">EVEN NUMBER</div>
                `;
            } else {
                resultDiv.innerHTML = `
                    <div class="result-text">The number</div>
                    <div class="result-number">${number}</div>
                    <div class="result-status odd">ODD NUMBER</div>
                `;
            }
        }

        // Allow Enter key to trigger check
        document.getElementById('number').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                checkEvenOdd();
            }
        });
    </script>
</body>
</html>

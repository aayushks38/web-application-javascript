<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 7 - Factorial Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .input-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
            width: 100%;
        }
        .btn:hover {
            background: #764ba2;
        }
        .result {
            margin-top: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        .result-text {
            font-size: 1.3em;
            color: #333;
            margin: 10px 0;
        }
        .factorial-formula {
            font-size: 1.1em;
            color: #666;
            margin: 15px 0;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }
        .result-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
            word-wrap: break-word;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Question 7</h1>
        <p class="subtitle">Factorial Calculator using Loop</p>
        
        <div class="input-group">
            <label for="number">Enter a Number:</label>
            <input type="number" id="number" placeholder="Enter a non-negative integer" min="0">
        </div>
        
        <button class="btn" onclick="calculateFactorial()">Calculate Factorial</button>
        
        <div class="result" id="result"></div>
        
        <a href="index.html" class="back-btn">← Back to Index</a>
    </div>

    <script>
        // Function to calculate factorial using loop
        function factorial(n) {
            if (n < 0) {
                return "Factorial is not defined for negative numbers";
            }
            
            if (n === 0 || n === 1) {
                return 1;
            }
            
            let result = 1;
            for (let i = 2; i <= n; i++) {
                result *= i;
            }
            
            return result;
        }

        // Function to generate factorial formula string
        function getFactorialFormula(n) {
            if (n === 0 || n === 1) {
                return `${n}! = 1`;
            }
            
            let formula = `${n}! = `;
            let terms = [];
            for (let i = n; i >= 1; i--) {
                terms.push(i);
            }
            formula += terms.join(' × ');
            return formula;
        }

        // Main function to calculate and display factorial
        function calculateFactorial() {
            const number = parseInt(document.getElementById('number').value);
            
            if (isNaN(number)) {
                alert('Please enter a valid number!');
                return;
            }
            
            if (number < 0) {
                alert('Factorial is not defined for negative numbers!');
                return;
            }
            
            if (number > 170) {
                alert('Number too large! Please enter a number less than or equal to 170.');
                return;
            }

            const result = factorial(number);
            const formula = getFactorialFormula(number);
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            
            resultDiv.innerHTML = `
                <div class="result-text">Factorial of ${number}</div>
                <div class="factorial-formula">${formula}</div>
                <div class="result-value">${result}</div>
            `;
        }

        // Allow Enter key to trigger calculation
        document.getElementById('number').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                calculateFactorial();
            }
        });
    </script>
</body>
</html>

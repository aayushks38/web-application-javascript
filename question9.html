<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 9 - Sum of N Natural Numbers</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .input-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
            width: 100%;
        }
        .btn:hover {
            background: #764ba2;
        }
        .result {
            margin-top: 30px;
            padding: 30px;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        .result-text {
            font-size: 1.3em;
            color: #333;
            margin: 10px 0;
        }
        .formula {
            font-size: 1.1em;
            color: #666;
            margin: 15px 0;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }
        .sum-value {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        .series {
            font-size: 1em;
            color: #666;
            margin: 15px 0;
            padding: 15px;
            background: white;
            border-radius: 8px;
            word-wrap: break-word;
        }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Question 9</h1>
        <p class="subtitle">Sum of First N Natural Numbers</p>
        
        <div class="input-group">
            <label for="number">Enter N:</label>
            <input type="number" id="number" placeholder="Enter a positive integer" min="1">
        </div>
        
        <button class="btn" onclick="calculateSum()">Calculate Sum</button>
        
        <div class="result" id="result"></div>
        
        <a href="index.html" class="back-btn">← Back to Index</a>
    </div>

    <script>
        // Function to calculate sum of first N natural numbers using loop
        function sumOfNaturalNumbers(n) {
            let sum = 0;
            for (let i = 1; i <= n; i++) {
                sum += i;
            }
            return sum;
        }

        // Function to generate series string
        function getSeries(n) {
            if (n <= 20) {
                let series = [];
                for (let i = 1; i <= n; i++) {
                    series.push(i);
                }
                return series.join(' + ');
            } else {
                return `1 + 2 + 3 + ... + ${n}`;
            }
        }

        // Main function to calculate and display sum
        function calculateSum() {
            const n = parseInt(document.getElementById('number').value);
            
            if (isNaN(n) || n < 1) {
                alert('Please enter a positive integer!');
                return;
            }

            const sum = sumOfNaturalNumbers(n);
            const series = getSeries(n);
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            
            resultDiv.innerHTML = `
                <div class="result-text">Sum of First ${n} Natural Numbers</div>
                <div class="series">${series}</div>
                <div class="sum-value">${sum}</div>
                <div class="formula">Formula: Sum = n(n+1)/2 = ${n}(${n}+1)/2 = ${sum}</div>
            `;
        }

        // Allow Enter key to trigger calculation
        document.getElementById('number').addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                calculateSum();
            }
        });
    </script>
</body>
</html>
